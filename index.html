<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#06070b" />
  <meta name="referrer" content="origin" />
  <title>FrameX</title>
  <style>
    :root {
      --bg: #06070b;
      --surface: rgba(20, 23, 34, 0.78);
      --surface-solid: #121520;
      --card: #161a28;
      --card-hover: #1e2336;
      --accent: #6366f1;
      --accent-light: #818cf8;
      --text: #f9fafb;
      --muted: #9ca3af;
      --gold: #fbbf24;
      --border: rgba(255, 255, 255, 0.08);
      --glass: rgba(14, 16, 24, 0.82);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding-bottom: calc(5.5rem + var(--safe-bottom));
      overflow-x: hidden;
      user-select: none;
    }

    /* Hide scrollbars cleanly */
    .no-scroll::-webkit-scrollbar { display: none; }
    .no-scroll { -ms-overflow-style: none; scrollbar-width: none; }

    /* Top Minimal Floating Header */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 0.75rem 1.1rem;
      background: linear-gradient(180deg, rgba(6,7,11,0.92) 0%, rgba(6,7,11,0.65) 70%, transparent 100%);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      transition: background 0.25s ease;
    }

    header.scrolled {
      background: var(--glass);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: -0.8px;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .search-bar {
      flex: 1;
      max-width: 460px;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      padding: 0.45rem 0.9rem;
      gap: 0.5rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s ease;
    }

    .search-bar:focus-within {
      background: rgba(22, 26, 40, 0.95);
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .search-bar input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 0.9rem;
    }

    .search-bar input::placeholder { color: rgba(255, 255, 255, 0.45); }

    .dice-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Full-Bleed Cinema Hero Showcase */
    .hero {
      position: relative;
      width: 100%;
      height: 64vh;
      min-height: 410px;
      max-height: 580px;
      background-size: cover;
      background-position: center 20%;
      display: flex;
      align-items: flex-end;
      padding: 1.5rem 1.2rem;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 50% 25%, transparent 10%, rgba(6, 7, 11, 0.55) 75%),
        linear-gradient(180deg, rgba(6,7,11,0.4) 0%, rgba(6,7,11,0.1) 35%, rgba(6,7,11,0.88) 82%, var(--bg) 100%);
    }

    .hero-box {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hero-badges {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      margin-bottom: 0.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tag-pill {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      padding: 0.22rem 0.6rem;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .tag-ar {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(129, 140, 248, 0.45);
      color: #c7d2fe;
    }

    .hero-title {
      font-size: clamp(1.75rem, 5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.6px;
      line-height: 1.1;
      margin-bottom: 0.55rem;
      text-shadow: 0 6px 24px rgba(0,0,0,0.8);
    }

    .hero-desc {
      font-size: 0.86rem;
      color: rgba(243, 244, 246, 0.78);
      line-height: 1.45;
      max-width: 520px;
      margin-bottom: 1.15rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-actions {
      display: flex;
      gap: 0.65rem;
      width: 100%;
      max-width: 360px;
      justify-content: center;
    }

    .btn-hero-play {
      flex: 1.4;
      background: #ffffff;
      color: #06070b;
      border: none;
      padding: 0.78rem 1.2rem;
      border-radius: 0.75rem;
      font-size: 0.94rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.18);
      transition: transform 0.15s ease;
    }

    .btn-hero-play:active { transform: scale(0.96); }

    .btn-hero-list {
      flex: 1;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 0.78rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn-hero-list:active { transform: scale(0.96); }

    /* Continue Watching Shelf */
    .shelf-section {
      padding: 0.5rem 0 0.75rem;
      display: none;
    }

    .shelf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.1rem 0.65rem;
    }

    .shelf-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .shelf-row {
      display: flex;
      gap: 0.85rem;
      overflow-x: auto;
      padding: 0 1.1rem;
    }

    .cw-card {
      width: 210px;
      flex-shrink: 0;
      background: var(--card);
      border-radius: 0.75rem;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
    }

    .cw-thumb {
      aspect-ratio: 16 / 9;
      width: 100%;
      background: #0d1018;
      position: relative;
    }

    .cw-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    .cw-thumb::after {
      content: "▶";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: #fff;
    }

    .cw-remove {
      position: absolute;
      top: 6px; right: 6px;
      z-index: 4;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.75);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      font-size: 0.75rem;
      display: flex; align-items: center; justify-content: center;
    }

    .cw-bar {
      height: 3px;
      background: rgba(255,255,255,0.15);
      width: 100%;
    }

    .cw-bar-fill {
      height: 100%;
      width: 65%;
      background: var(--accent);
    }

    .cw-meta {
      padding: 0.55rem 0.65rem;
    }

    .cw-name {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cw-sub {
      font-size: 0.72rem;
      color: var(--accent-light);
      font-weight: 600;
      margin-top: 2px;
    }

    /* Filter Pills & Sort Row */
    .filters-area {
      padding: 0.4rem 0 0.5rem;
    }

    .pill-row {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding: 0.25rem 1.1rem;
    }

    .pill {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.42rem 0.9rem;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pill.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
      font-weight: 800;
    }

    .catalog-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.65rem 1.1rem 0.4rem;
    }

    .catalog-title {
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .sort-pills {
      display: flex;
      background: var(--card);
      border-radius: 99px;
      padding: 2px;
      border: 1px solid var(--border);
    }

    .sort-btn {
      background: transparent;
      color: var(--muted);
      border: none;
      padding: 0.28rem 0.65rem;
      border-radius: 99px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .sort-btn.active {
      background: var(--accent);
      color: #fff;
    }

    /* Poster Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
      gap: 0.75rem;
      padding: 0.5rem 1.1rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 1rem; }
    }

    .card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card:active { transform: scale(0.95); }

    .poster {
      aspect-ratio: 2 / 3;
      width: 100%;
      border-radius: 0.75rem;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
      position: relative;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.25s ease;
    }

    .rate-tag {
      position: absolute;
      top: 7px; left: 7px;
      background: rgba(6, 7, 11, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .card-title {
      font-size: 0.78rem;
      font-weight: 600;
      margin-top: 0.42rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e5e7eb;
    }

    .card-sub {
      font-size: 0.68rem;
      color: var(--muted);
    }

    /* Skeleton Loader */
    @keyframes pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }
    .skeleton {
      aspect-ratio: 2 / 3;
      border-radius: 0.75rem;
      background: var(--card);
      animation: pulse 1.4s infinite ease-in-out;
    }

    .load-more-box {
      text-align: center;
      padding: 1.5rem 1.1rem;
    }

    .btn-more {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 2.2rem;
      border-radius: 99px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Floating Glass Bottom Tab Bar (Native iOS Feel) */
    .bottom-nav {
      position: fixed;
      bottom: calc(0.65rem + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 90;
      width: calc(100% - 2rem);
      max-width: 440px;
      background: rgba(18, 21, 32, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 99px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0.4rem 0.5rem;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
    }

    .nav-item {
      background: transparent;
      border: none;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 0.35rem 0.75rem;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .nav-item span.ico { font-size: 1.05rem; }

    .nav-item.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.28);
      font-weight: 800;
    }

    /* Fullscreen Luxury Sheet Modal */
    .sheet {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .sheet.open { display: flex; }

    .sheet-top {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(10, 12, 18, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .sheet-back {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 0.42rem 0.85rem;
      border-radius: 99px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .sheet-title-bar {
      font-size: 0.88rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 50%;
    }

    .sheet-actions { display: flex; gap: 0.4rem; }

    .btn-chip {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.42rem 0.75rem;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* 16:9 Cinema Stage */
    .player-stage {
      width: 100%;
      max-width: 1060px;
      margin: 0 auto;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
      flex-shrink: 0;
      box-shadow: 0 12px 40px rgba(0,0,0,0.8);
    }

    .player-stage iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* Swipeable Server & Subtitle Bar */
    .server-strip {
      max-width: 1060px;
      margin: 0 auto;
      width: 100%;
      padding: 0.75rem 1rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .strip-label {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.45rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sub-indicator {
      color: #a5b4fc;
      text-transform: none;
      font-weight: 600;
    }

    .server-pills {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .srv-pill {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 0.6rem;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .srv-pill.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent-light);
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    /* Visual TV Seasons & Episodes Drawer */
    .tv-drawer {
      max-width: 1060px;
      margin: 0 auto;
      width: 100%;
      padding: 0.9rem 1rem 0.4rem;
      display: none;
    }

    .season-row {
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      margin-bottom: 0.85rem;
    }

    .ep-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 0.65rem;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .ep-card {
      display: flex;
      gap: 0.7rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.65rem;
      padding: 0.45rem;
      cursor: pointer;
      align-items: center;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .ep-card.active {
      border-color: var(--accent-light);
      background: rgba(99, 102, 241, 0.16);
    }

    .ep-thumb {
      width: 96px;
      aspect-ratio: 16 / 9;
      border-radius: 0.4rem;
      overflow: hidden;
      background: #0d1018;
      flex-shrink: 0;
      position: relative;
    }

    .ep-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .ep-num-badge {
      position: absolute;
      bottom: 4px; left: 4px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 0.62rem;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 4px;
    }

    .ep-info { flex: 1; min-width: 0; }
    .ep-title {
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .ep-desc {
      font-size: 0.7rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
    }

    /* Movie / Series Storyline, Cast & Similar */
    .info-pane {
      max-width: 1060px;
      margin: 0 auto;
      width: 100%;
      padding: 1rem 1rem 3rem;
    }

    .info-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.3rem; }
    .info-meta { display: flex; gap: 0.65rem; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.75rem; flex-wrap: wrap; }
    .info-overview { font-size: 0.88rem; color: #d1d5db; line-height: 1.55; margin-bottom: 1.4rem; }

    .sec-head { font-size: 0.95rem; font-weight: 800; margin: 1.2rem 0 0.65rem; }
    .cast-strip { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.4rem; }
    .cast-item { width: 70px; flex-shrink: 0; text-align: center; }
    .cast-item img {
      width: 62px; height: 62px; border-radius: 50%; object-fit: cover;
      background: var(--card); border: 1px solid var(--border); margin-bottom: 4px;
    }
    .cast-item div { font-size: 0.68rem; color: #e5e7eb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <!-- Minimal Floating Top Header -->
  <header id="topHeader">
    <div class="brand" id="logoBtn">
      <div class="brand-dot"></div>
      FrameX
    </div>
    <div class="search-bar">
      <span style="font-size:0.85rem;opacity:0.6;">🔍</span>
      <input type="search" id="searchInput" placeholder="Movies, series, anime..." />
    </div>
    <button class="dice-btn" id="randomBtn" title="Surprise Me">🎲</button>
  </header>

  <!-- Apple TV+ Style Hero Showcase -->
  <section class="hero" id="heroSection">
    <div class="hero-box">
      <div class="hero-badges">
        <span class="tag-pill" id="heroType">FEATURED</span>
        <span class="tag-pill" id="heroRating">★ 8.5</span>
        <span class="tag-pill tag-ar">🇸🇦 العربية CC</span>
      </div>
      <h1 class="hero-title" id="heroTitle">Loading...</h1>
      <p class="hero-desc" id="heroDesc"></p>
      <div class="hero-actions">
        <button class="btn-hero-play" id="heroPlay">▶ Play Now</button>
        <button class="btn-hero-list" id="heroSave">＋ My List</button>
      </div>
    </div>
  </section>

  <!-- Continue Watching Shelf (Auto-Hides When Empty) -->
  <section class="shelf-section" id="cwSection">
    <div class="shelf-header">
      <div class="shelf-title">Continue Watching</div>
    </div>
    <div class="shelf-row no-scroll" id="cwRow"></div>
  </section>

  <!-- Swipeable Genre Filter Pills -->
  <section class="filters-area">
    <div class="pill-row no-scroll" id="genreRow"></div>
    <div class="catalog-bar">
      <div class="catalog-title" id="catalogHeading">Trending Now</div>
      <div class="sort-pills" id="sortGroup">
        <button class="sort-btn active" data-sort="popularity.desc">Hot</button>
        <button class="sort-btn" data-sort="vote_average.desc">Top</button>
        <button class="sort-btn" data-sort="primary_release_date.desc">New</button>
      </div>
    </div>
  </section>

  <!-- Main Poster Grid -->
  <main class="grid" id="mainGrid"></main>

  <div class="load-more-box" id="moreWrap">
    <button class="btn-more" id="moreBtn">Load More</button>
  </div>

  <!-- Native iOS Style Floating Glass Bottom Navigation -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" data-tab="trending">
      <span class="ico">🏠</span>
      <span>Home</span>
    </button>
    <button class="nav-item" data-tab="movie">
      <span class="ico">🎬</span>
      <span>Movies</span>
    </button>
    <button class="nav-item" data-tab="tv">
      <span class="ico">📺</span>
      <span>Series</span>
    </button>
    <button class="nav-item" data-tab="anime">
      <span class="ico">⛩️</span>
      <span>Anime</span>
    </button>
    <button class="nav-item" data-tab="saved">
      <span class="ico">⭐</span>
      <span>My List</span>
    </button>
  </nav>

  <!-- Fullscreen Player & Episode Sheet -->
  <div class="sheet" id="playerSheet">
    <div class="sheet-top">
      <button class="sheet-back" id="closeSheetBtn">‹ Back</button>
      <div class="sheet-title-bar" id="sheetTitle">Playing</div>
      <div class="sheet-actions">
        <button class="btn-chip" id="trailerToggleBtn">🎞 Trailer</button>
        <button class="btn-chip" id="sheetSaveBtn">＋ List</button>
      </div>
    </div>

    <div class="player-stage" id="playerStage"></div>

    <!-- Tactile Server Switcher Strip -->
    <div class="server-strip">
      <div class="strip-label">
        <span>Select Server (Switch if slow)</span>
        <span class="sub-indicator" id="subBadge">🇸🇦 Arabic Subtitles Active</span>
      </div>
      <div class="server-pills no-scroll" id="serverPills"></div>
    </div>

    <!-- Visual TV Seasons & Episodes Selector -->
    <div class="tv-drawer" id="tvDrawer">
      <div class="strip-label" style="margin-bottom:0.5rem;">
        <span>Seasons & Episodes</span>
        <button class="btn-chip active" id="nextEpQuickBtn" style="padding:0.25rem 0.65rem;font-size:0.72rem;">Next Episode ⏭</button>
      </div>
      <div class="season-row no-scroll" id="seasonPills"></div>
      <div class="ep-list" id="epList"></div>
    </div>

    <!-- Rich Storyline, Cast & Similar Titles -->
    <div class="info-pane">
      <div class="info-title" id="infoTitle"></div>
      <div class="info-meta" id="infoMeta"></div>
      <p class="info-overview" id="infoDesc"></p>

      <div id="castWrap">
        <div class="sec-head">Cast</div>
        <div class="cast-strip no-scroll" id="castStrip"></div>
      </div>

      <div id="similarWrap">
        <div class="sec-head">More Like This</div>
        <div class="grid" id="similarGrid" style="padding:0;"></div>
      </div>
    </div>
  </div>

  <script>
    "use strict";
    window.open = function () { return null; };

    const API_KEY = "3fd2be6f0c70a2a598f084ddfb75487c";

    // 10 High-Speed Embed Servers (No Sandbox Restriction, Default Arabic Subtitles Injected)
    const SERVERS = [
      { name: "VidLink 4K", m: "https://vidlink.pro/movie/{id}?ds_lang=ar&sub_lang=ar&autoplay=true{vl_sub}", t: "https://vidlink.pro/tv/{id}/{s}/{e}?ds_lang=ar&sub_lang=ar&autoplay=true{vl_sub}" },
      { name: "AutoEmbed Pro", m: "https://player.autoembed.cc/embed/movie/{id}?ds_lang=ar&sub=ar&lang=ar", t: "https://player.autoembed.cc/embed/tv/{id}/{s}/{e}?ds_lang=ar&sub=ar&lang=ar" },
      { name: "VidSrc.cc", m: "https://vidsrc.cc/v2/embed/movie/{id}?autoPlay=true&ds_lang=ar", t: "https://vidsrc.cc/v2/embed/tv/{id}/{s}/{e}?autoPlay=true&ds_lang=ar" },
      { name: "VidSrc.icu", m: "https://vidsrc.icu/embed/movie/{id}?ds_lang=ar&sub.lang=ar{vs_sub}", t: "https://vidsrc.icu/embed/tv/{id}/{s}/{e}?ds_lang=ar&sub.lang=ar{vs_sub}" },
      { name: "VidSrc.pm", m: "https://vidsrc.pm/embed/movie/{id}?ds_lang=ar&sub.lang=ar{vs_sub}", t: "https://vidsrc.pm/embed/tv/{id}/{s}-{e}?ds_lang=ar&sub.lang=ar{vs_sub}" },
      { name: "MultiEmbed", m: "https://multiembed.mov/?video_id={id}&tmdb=1&ds_lang=ar&sub=ar", t: "https://multiembed.mov/?video_id={id}&tmdb=1&s={s}&e={e}&ds_lang=ar&sub=ar" },
      { name: "VidSrc.in", m: "https://vidsrc.in/embed/movie/{id}?ds_lang=ar&sub.lang=ar{vs_sub}", t: "https://vidsrc.in/embed/tv/{id}/{s}-{e}?ds_lang=ar&sub.lang=ar{vs_sub}" },
      { name: "Embed.su", m: "https://embed.su/embed/movie/{id}?ds_lang=ar", t: "https://embed.su/embed/tv/{id}/{s}/{e}?ds_lang=ar" },
      { name: "2Embed", m: "https://www.2embed.cc/embed/{id}?ds_lang=ar", t: "https://www.2embed.cc/embedtv/{id}&s={s}&e={e}&ds_lang=ar" },
      { name: "NontonGo", m: "https://www.nontongo.win/embed/movie/{id}?ds_lang=ar", t: "https://www.nontongo.win/embed/tv/{id}/{s}/{e}?ds_lang=ar" }
    ];

    const GENRES = [
      { id: 0, name: "All" }, { id: 28, name: "Action" }, { id: 12, name: "Adventure" },
      { id: 16, name: "Animation" }, { id: 35, name: "Comedy" }, { id: 80, name: "Crime" },
      { id: 18, name: "Drama" }, { id: 14, name: "Fantasy" }, { id: 27, name: "Horror" },
      { id: 9648, name: "Mystery" }, { id: 10749, name: "Romance" }, { id: 878, name: "Sci-Fi" },
      { id: 53, name: "Thriller" }
    ];

    let tab = "trending", genre = 0, sortBy = "popularity.desc", page = 1;
    let catalog = [], heroItem = null, active = null, s = 1, e = 1, srv = 0;
    let seasons = [], episodes = [], trailerKey = null, isTrailer = false, arabicSubFile = "";

    const getStore = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; } };
    const setStore = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

    window.addEventListener("scroll", () => {
      document.getElementById("topHeader").classList.toggle("scrolled", window.scrollY > 30);
    });

    async function tmdb(path) {
      const sep = path.includes("?") ? "&" : "?";
      const r = await fetch(`https://api.themoviedb.org/3${path}${sep}api_key=${API_KEY}&language=en-US`);
      return r.json();
    }

    // Automatically look up verified Arabic subtitle file from OpenSubtitles/Wyzie
    async function resolveArabicSub(tmdbId, isTv, sNum, eNum) {
      arabicSubFile = "";
      const badge = document.getElementById("subBadge");
      badge.textContent = "🇸🇦 Arabic Subtitles Requested";
      try {
        const u = isTv
          ? `https://sub.wyzie.ru/search?id=${tmdbId}&season=${sNum}&episode=${eNum}&language=ar`
          : `https://sub.wyzie.ru/search?id=${tmdbId}&language=ar`;
        const r = await fetch(u);
        if (!r.ok) return;
        const list = await r.json();
        if (Array.isArray(list) && list.length > 0 && list[0].url) {
          arabicSubFile = list[0].url;
          badge.textContent = "🇸🇦 Verified Arabic Track Injected ✓";
        }
      } catch {}
    }

    function renderGenres() {
      const row = document.getElementById("genreRow");
      row.innerHTML = "";
      GENRES.forEach(g => {
        const b = document.createElement("button");
        b.className = `pill ${genre === g.id ? "active" : ""}`;
        b.textContent = g.name;
        b.onclick = () => { genre = g.id; page = 1; renderGenres(); fetchCatalog(false); };
        row.appendChild(b);
      });
    }

    function renderServerPills() {
      const wrap = document.getElementById("serverPills");
      wrap.innerHTML = "";
      SERVERS.forEach((sv, idx) => {
        const b = document.createElement("button");
        b.className = `srv-pill ${srv === idx ? "active" : ""}`;
        b.textContent = sv.name;
        b.onclick = () => {
          srv = idx;
          isTrailer = false;
          document.getElementById("trailerToggleBtn").classList.remove("active");
          renderServerPills();
          mountPlayer();
        };
        wrap.appendChild(b);
      });
    }

    function renderContinueWatching() {
      const hist = getStore("fx_history");
      const sec = document.getElementById("cwSection");
      const row = document.getElementById("cwRow");

      if (!hist.length || tab !== "trending" || document.getElementById("searchInput").value.trim()) {
        sec.style.display = "none";
        return;
      }

      sec.style.display = "block";
      row.innerHTML = "";
      hist.forEach(item => {
        const card = document.createElement("div");
        card.className = "cw-card";
        const img = item.backdrop_path
          ? `https://image.tmdb.org/t/p/w500${item.backdrop_path}`
          : (item.poster_path ? `https://image.tmdb.org/t/p/w342${item.poster_path}` : "");
        const subLabel = item.lastS ? `Resume Season ${item.lastS} • Ep ${item.lastE}` : "Resume Movie";

        card.innerHTML = `
          <div class="cw-thumb">
            <img src="${img}" loading="lazy" alt="" />
            <button class="cw-remove" title="Remove">✕</button>
          </div>
          <div class="cw-bar"><div class="cw-bar-fill"></div></div>
          <div class="cw-meta">
            <div class="cw-name">${item.title || item.name}</div>
            <div class="cw-sub">${subLabel}</div>
          </div>
        `;

        card.querySelector(".cw-remove").onclick = ev => {
          ev.stopPropagation();
          setStore("fx_history", getStore("fx_history").filter(x => x.id !== item.id));
          renderContinueWatching();
        };

        card.onclick = () => openPlayerSheet(item);
        row.appendChild(card);
      });
    }

    function showSkeletons() {
      const grid = document.getElementById("mainGrid");
      grid.innerHTML = "";
      for (let i = 0; i < 12; i++) {
        const sk = document.createElement("div");
        sk.className = "skeleton";
        grid.appendChild(sk);
      }
    }

    async function fetchCatalog(append = false) {
      const grid = document.getElementById("mainGrid");
      const q = document.getElementById("searchInput").value.trim();
      const moreWrap = document.getElementById("moreWrap");

      renderContinueWatching();
      if (!append) showSkeletons();

      let results = [];
      try {
        if (tab === "saved") {
          results = getStore("fx_saved");
          moreWrap.style.display = "none";
        } else {
          moreWrap.style.display = "block";
          if (q) {
            const d = await tmdb(`/search/multi?query=${encodeURIComponent(q)}&page=${page}`);
            results = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
          } else if (tab === "trending") {
            const d = await tmdb(`/trending/all/week?page=${page}`);
            results = (d.results || []).filter(x => x.media_type === "movie" || x.media_type === "tv");
            if (genre) results = results.filter(x => (x.genre_ids || []).includes(genre));
          } else if (tab === "movie") {
            const g = genre ? `&with_genres=${genre}` : "";
            const d = await tmdb(`/discover/movie?sort_by=${sortBy}&vote_count.gte=60&page=${page}${g}`);
            results = (d.results || []).map(x => ({ ...x, media_type: "movie" }));
          } else if (tab === "tv") {
            const g = genre ? `&with_genres=${genre}` : "";
            const d = await tmdb(`/discover/tv?sort_by=${sortBy}&vote_count.gte=60&page=${page}${g}`);
            results = (d.results || []).map(x => ({ ...x, media_type: "tv" }));
          } else if (tab === "anime") {
            const d = await tmdb(`/discover/tv?with_genres=16&with_original_language=ja&sort_by=${sortBy}&page=${page}`);
            results = (d.results || []).map(x => ({ ...x, media_type: "tv" }));
          }
        }
      } catch { results = []; }

      catalog = append ? [...catalog, ...results] : results;
      if (!append) updateHero();
      renderCards(grid, catalog);
    }

    function updateHero() {
      const h = catalog[0];
      if (!h) return;
      heroItem = h;
      const heroSec = document.getElementById("heroSection");
      const bg = h.backdrop_path
        ? `https://image.tmdb.org/t/p/w1280${h.backdrop_path}`
        : (h.poster_path ? `https://image.tmdb.org/t/p/w780${h.poster_path}` : "");
      heroSec.style.backgroundImage = bg ? `url('${bg}')` : "none";
      document.getElementById("heroType").textContent = (h.media_type || (h.first_air_date ? " SERIES" : "MOVIE")).toUpperCase();
      document.getElementById("heroRating").textContent = `★ ${(h.vote_average || 0).toFixed(1)}`;
      document.getElementById("heroTitle").textContent = h.title || h.name || "Featured";
      document.getElementById("heroDesc").textContent = h.overview || "";
    }

    function renderCards(container, list) {
      container.innerHTML = "";
      const valid = list.filter(x => x.poster_path);
      if (!valid.length) {
        container.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:2.5rem;color:#9ca3af;">No titles found.</p>`;
        return;
      }
      valid.forEach(item => {
        const el = document.createElement("div");
        el.className = "card";
        const yr = (item.release_date || item.first_air_date || "").slice(0, 4);
        const typeLabel = (item.media_type || (item.first_air_date ? "TV" : "Movie")) === "tv" ? "Series" : "Movie";
        el.innerHTML = `
          <div class="poster">
            <img src="https://image.tmdb.org/t/p/w342${item.poster_path}" loading="lazy" alt="" />
            <span class="rate-tag">★ ${(item.vote_average || 0).toFixed(1)}</span>
          </div>
          <div class="card-title">${item.title || item.name}</div>
          <div class="card-sub">${yr} • ${typeLabel}</div>
        `;
        el.onclick = () => openPlayerSheet(item);
        container.appendChild(el);
      });
    }

    async function openPlayerSheet(item) {
      active = { ...item, media_type: item.media_type || (item.first_air_date ? "tv" : "movie") };
      s = item.lastS || 1;
      e = item.lastE || 1;
      isTrailer = false;
      document.getElementById("trailerToggleBtn").classList.remove("active");
      document.getElementById("sheetTitle").textContent = active.title || active.name;

      const isTv = active.media_type === "tv";
      document.getElementById("tvDrawer").style.display = isTv ? "block" : "none";

      syncSaveState();
      renderServerPills();

      const sheet = document.getElementById("playerSheet");
      sheet.classList.add("open");
      sheet.scrollTop = 0;

      loadSheetMetadata(active.id, isTv);

      if (isTv) {
        try {
          const d = await tmdb(`/tv/${active.id}`);
          seasons = (d.seasons || []).filter(x => x.season_number > 0);
        } catch { seasons = [{ season_number: 1, episode_count: 12 }]; }
        if (!seasons.length) seasons = [{ season_number: 1, episode_count: 12 }];
        renderSeasonPills();
        await fetchEpisodesList(active.id, s);
      }

      await startPlayback();
    }

    function renderSeasonPills() {
      const wrap = document.getElementById("seasonPills");
      wrap.innerHTML = "";
      seasons.forEach(sn => {
        const b = document.createElement("button");
        b.className = `pill ${Number(sn.season_number) === Number(s) ? "active" : ""}`;
        b.textContent = `Season ${sn.season_number}`;
        b.onclick = async () => {
          s = sn.season_number;
          e = 1;
          renderSeasonPills();
          await fetchEpisodesList(active.id, s);
          await startPlayback();
        };
        wrap.appendChild(b);
      });
    }

    async function fetchEpisodesList(tvId, seasonNum) {
      const listEl = document.getElementById("epList");
      listEl.innerHTML = `<p style="color:#9ca3af;font-size:0.8rem;padding:0.5rem;">Loading episodes...</p>`;
      try {
        const d = await tmdb(`/tv/${tvId}/season/${seasonNum}`);
        episodes = d.episodes || [];
      } catch { episodes = []; }

      listEl.innerHTML = "";
      if (!episodes.length) {
        for (let i = 1; i <= 12; i++) {
          episodes.push({ episode_number: i, name: `Episode ${i}`, overview: "" });
        }
      }

      episodes.forEach(ep => {
        const card = document.createElement("div");
        card.className = `ep-card ${Number(ep.episode_number) === Number(e) ? "active" : ""}`;
        const thumb = ep.still_path
          ? `https://image.tmdb.org/t/p/w300${ep.still_path}`
          : (active.backdrop_path ? `https://image.tmdb.org/t/p/w300${active.backdrop_path}` : "");

        card.innerHTML = `
          <div class="ep-thumb">
            ${thumb ? `<img src="${thumb}" loading="lazy" alt="" />` : ""}
            <span class="ep-num-badge">E${ep.episode_number}</span>
          </div>
          <div class="ep-info">
            <div class="ep-title">${ep.episode_number}. ${ep.name || "Episode " + ep.episode_number}</div>
            <div class="ep-desc">${ep.overview || "Tap to play episode with Arabic subtitles."}</div>
          </div>
        `;

        card.onclick = async () => {
          e = ep.episode_number;
          document.querySelectorAll(".ep-card").forEach(c => c.classList.remove("active"));
          card.classList.add("active");
          document.getElementById("playerSheet").scrollTo({ top: 0, behavior: "smooth" });
          await startPlayback();
        };
        listEl.appendChild(card);
      });
    }

    async function loadSheetMetadata(id, isTv) {
      const type = isTv ? "tv" : "movie";
      document.getElementById("infoTitle").textContent = active.title || active.name;
      document.getElementById("infoDesc").textContent = active.overview || "";
      document.getElementById("infoMeta").innerHTML = "";
      document.getElementById("castStrip").innerHTML = "";
      document.getElementById("similarGrid").innerHTML = "";
      trailerKey = null;

      try {
        const d = await tmdb(`/${type}/${id}?append_to_response=credits,videos,recommendations`);
        const yr = (d.release_date || d.first_air_date || "").slice(0, 4);
        const dur = d.runtime ? `${d.runtime}m` : (d.number_of_seasons ? `${d.number_of_seasons} Seasons` : "");
        const gns = (d.genres || []).map(x => x.name).join(" • ");
        document.getElementById("infoMeta").innerHTML = `
          <span style="color:#fbbf24;font-weight:800;">★ ${(d.vote_average || 0).toFixed(1)}</span>
          <span>${yr}</span>
          <span>${dur}</span>
          <span>${gns}</span>
        `;

        const vids = (d.videos && d.videos.results) || [];
        const yt = vids.find(v => v.site === "YouTube" && v.type === "Trailer") || vids.find(v => v.site === "YouTube");
        if (yt) trailerKey = yt.key;

        const cast = (d.credits && d.credits.cast ? d.credits.cast : []).slice(0, 14);
        const cStrip = document.getElementById("castStrip");
        cast.forEach(c => {
          if (!c.profile_path) return;
          const el = document.createElement("div");
          el.className = "cast-item";
          el.innerHTML = `<img src="https://image.tmdb.org/t/p/w185${c.profile_path}" loading="lazy" alt="" /><div>${c.name}</div>`;
          cStrip.appendChild(el);
        });

        const recs = (d.recommendations && d.recommendations.results ? d.recommendations.results : []).slice(0, 8);
        renderCards(document.getElementById("similarGrid"), recs);
      } catch {}
    }

    async function startPlayback() {
      recordProgress();
      const isTv = active.media_type === "tv";
      await resolveArabicSub(active.id, isTv, s, e);
      mountPlayer();
    }

    function mountPlayer() {
      const stage = document.getElementById("playerStage");
      stage.innerHTML = "";

      if (isTrailer && trailerKey) {
        const yf = document.createElement("iframe");
        yf.setAttribute("allow", "autoplay; fullscreen");
        yf.src = `https://www.youtube.com/embed/${trailerKey}?autoplay=1`;
        stage.appendChild(yf);
        return;
      }

      const sv = SERVERS[srv] || SERVERS[0];
      const tpl = active.media_type === "tv" ? sv.t : sv.m;
      const vsSub = arabicSubFile ? `&sub.file=${encodeURIComponent(arabicSubFile)}&sub.label=Arabic` : "";
      const vlSub = arabicSubFile ? `&sub_file=${encodeURIComponent(arabicSubFile)}&sub_label=Arabic` : "";

      const url = tpl
        .replace("{id}", active.id)
        .replace("{s}", s)
        .replace("{e}", e)
        .replace("{vs_sub}", vsSub)
        .replace("{vl_sub}", vlSub);

      const f = document.createElement("iframe");
      // NO sandbox attribute here — 100% eliminates "Sandbox is not allowed" errors!
      f.setAttribute("allow", "autoplay; fullscreen; picture-in-picture; encrypted-media");
      f.setAttribute("allowfullscreen", "true");
      f.setAttribute("referrerpolicy", "origin");
      f.src = url;
      stage.appendChild(f);
    }

    function recordProgress() {
      if (!active) return;
      const hist = getStore("fx_history").filter(x => x.id !== active.id);
      hist.unshift({
        ...active,
        lastS: active.media_type === "tv" ? s : null,
        lastE: active.media_type === "tv" ? e : null,
        ts: Date.now()
      });
      setStore("fx_history", hist.slice(0, 30));
      renderContinueWatching();
    }

    function toggleSaved(item) {
      if (!item) return;
      const list = getStore("fx_saved");
      const exists = list.some(x => x.id === item.id);
      setStore("fx_saved", exists ? list.filter(x => x.id !== item.id) : [item, ...list]);
      syncSaveState();
      if (tab === "saved") fetchCatalog(false);
    }

    function syncSaveState() {
      if (!active) return;
      const exists = getStore("fx_saved").some(x => x.id === active.id);
      const btn = document.getElementById("sheetSaveBtn");
      btn.textContent = exists ? "✓ In List" : "＋ List";
      btn.classList.toggle("active", exists);
    }

    // Event Listeners
    document.getElementById("bottomNav").onclick = ev => {
      const b = ev.target.closest("button[data-tab]");
      if (!b) return;
      document.querySelectorAll("#bottomNav .nav-item").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      tab = b.dataset.tab;
      page = 1;
      const titles = { trending: "Trending Now", movie: "Movies", tv: "TV Series", anime: "Anime", saved: "My Saved List" };
      document.getElementById("catalogHeading").textContent = titles[tab] || "Catalog";
      window.scrollTo({ top: 0, behavior: "smooth" });
      fetchCatalog(false);
    };

    document.getElementById("sortGroup").onclick = ev => {
      const b = ev.target.closest("button[data-sort]");
      if (!b) return;
      document.querySelectorAll("#sortGroup .sort-btn").forEach(x => x.classList.remove("active"));
      b.classList.add("active");
      sortBy = b.dataset.sort;
      page = 1;
      fetchCatalog(false);
    };

    let debounce = null;
    document.getElementById("searchInput").oninput = ev => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        page = 1;
        document.getElementById("catalogHeading").textContent = ev.target.value.trim()
          ? `Search: "${ev.target.value.trim()}"`
          : "Trending Now";
        fetchCatalog(false);
      }, 300);
    };

    document.getElementById("moreBtn").onclick = () => { page += 1; fetchCatalog(true); };

    document.getElementById("randomBtn").onclick = () => {
      if (catalog.length) {
        openPlayerSheet(catalog[Math.floor(Math.random() * catalog.length)]);
      }
    };

    document.getElementById("logoBtn").onclick = () => {
      document.getElementById("searchInput").value = "";
      genre = 0; page = 1; tab = "trending";
      document.querySelectorAll("#bottomNav .nav-item").forEach(x => x.classList.toggle("active", x.dataset.tab === "trending"));
      renderGenres();
      window.scrollTo({ top: 0, behavior: "smooth" });
      fetchCatalog(false);
    };

    document.getElementById("heroPlay").onclick = () => heroItem && openPlayerSheet(heroItem);
    document.getElementById("heroSave").onclick = () => heroItem && toggleSaved(heroItem);

    document.getElementById("closeSheetBtn").onclick = () => {
      document.getElementById("playerSheet").classList.remove("open");
      document.getElementById("playerStage").innerHTML = "";
    };

    document.getElementById("sheetSaveBtn").onclick = () => toggleSaved(active);

    document.getElementById("trailerToggleBtn").onclick = ev => {
      if (!trailerKey) { alert("No official trailer available for this title."); return; }
      isTrailer = !isTrailer;
      ev.target.classList.toggle("active", isTrailer);
      mountPlayer();
    };

    document.getElementById("nextEpQuickBtn").onclick = async () => {
      if (e < episodes.length) {
        e += 1;
        await fetchEpisodesList(active.id, s);
        await startPlayback();
      }
    };

    renderGenres();
    fetchCatalog(false);
  </script>
</body>
</html>
